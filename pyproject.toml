[build-system]
# setuptools-scm pinned <9: the 9.x split into the `vcs_versioning` backend
# asserts (`assert version is not None`) when deriving a version from a tagless
# git-SHA install (how fabrica-v3-api's avm worker installs this fork), breaking
# the Docker image build. 8.x falls back gracefully. Keep this until the build
# installs a tagged/sdist artifact instead of a bare commit.
requires = ["setuptools>=69", "wheel", "setuptools-scm[toml]>=8,<9"]
build-backend = "setuptools.build_meta"

[project]
name = "openavmkit"
description = "Open-source automated valuation model (AVM) toolkit"
# 'readme' is dynamic: setup.py supplies long_description, rewriting the README's repo-relative
# links to absolute GitHub URLs so they work on PyPI (which renders the README without repo
# context). The README file itself stays relative for GitHub and the docs site.
requires-python = ">=3.11"
# Dual license (AGPLv3 OR commercial).
license = { file = "LICENSE-AGPLv3" }
authors = [{ name = "Lars A. Doucet", email = "lars.doucet+openavmkit@gmail.com" }]
dynamic = ["version", "dependencies", "readme"]
keywords = ["avm", "mass appraisal", "valuation", "gis", "real estate"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "License :: Other/Proprietary License",
  "Development Status :: 4 - Beta",
]

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://www.openavmkit.com/"
Source = "https://github.com/larsiusprime/openavmkit"
Issues = "https://github.com/larsiusprime/openavmkit/issues"
Changelog = "https://github.com/larsiusprime/openavmkit/blob/master/changelog.md"

# NOTE: remove the version-from-attr; setuptools-scm supplies the version
[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["openavmkit*"]

[tool.setuptools.package-data]
openavmkit = [
  "resources/**/*.json",
  "resources/**/*.yaml",
  "resources/**/*.yml",
  "resources/**/*.txt",
]

# Ensure both license files land in sdists
[tool.setuptools]
license-files = ["LICENSE-AGPLv3", "LICENSE-COMMERCIAL"]
include-package-data = true

[tool.setuptools_scm]
# Derive version from your git tags, e.g. v0.3.0rc2 -> 0.3.0rc2
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"
# Only consider real version tags (vX.Y.Z) when deriving the version. Without
# this, `git describe` can return a non-version tag (e.g. an `archive/*` marker
# pushed to this fork), which setuptools-scm cannot parse — it then asserts
# `version is not None` and the wheel build fails. This breaks every consumer
# installing the fork from a tagless commit (fabrica-v3-api's avm worker does
# `openavmkit @ git+...@<sha>`). Matching only version tags makes describe ignore
# stray tags and fall through to the commit-count dev version, which is fine for
# a SHA-pinned dependency. fallback_version is a final safety net.
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]
fallback_version = "0.0.0"
# (Optional) If you want a vendored version file for src checkouts, uncomment:
# write_to = "openavmkit/_version.py"

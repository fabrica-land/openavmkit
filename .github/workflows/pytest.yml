name: Run Pytest

on:
  push:
    branches: [master, integration]
  pull_request:
    branches: [master, integration]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: ENG-5167 CA trust fix (remove emSign ECC Root CA - G3)
        shell: bash
        run: |
          set +e -uo pipefail
          B=/etc/ssl/certs/ca-certificates.crt
          G3=86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b
          X1=96bcec06264976f37460779acf28c5a7cfe8a3c0aae11a8ffcee05c0bddf08c6
          fps() { awk '/-----BEGIN CERTIFICATE-----/{c="openssl x509 -noout -fingerprint -sha256"} c{print | c} /-----END CERTIFICATE-----/{close(c); c=""}' "$B" | sed 's/^.*=//; s/://g' | tr 'A-F' 'a-f'; }
          if [ "$(fps | grep -c -x "$G3")" != 0 ]; then
            echo "ENG5167 G3 present: upgrading ca-certificates"
            sudo apt-get update -qq && sudo apt-get install -y -qq --only-upgrade ca-certificates
          fi
          if [ "$(fps | grep -c -x "$G3")" != 0 ]; then
            echo "ENG5167 G3 remains: disabling the Mozilla certificate"
            sudo sed -i 's|^mozilla/emSign_ECC_Root_CA_-_G3\.crt$|!&|' /etc/ca-certificates.conf || exit 1
            sudo update-ca-certificates --fresh || exit 1
          fi
          dpkg-query -W ca-certificates
          FP=$(fps)
          N=$(printf '%s\n' "$FP" | grep -c .)
          PEM=$(grep -c 'BEGIN CERTIFICATE' "$B")
          G3N=$(printf '%s\n' "$FP" | grep -c -x "$G3")
          X1N=$(printf '%s\n' "$FP" | grep -c -x "$X1")
          echo "ENG5167 certs=${N} pem_blocks=${PEM} g3_sha256_count=${G3N} isrg_x1_sha256_count=${X1N}"
          if [ "$G3N" = 0 ] && [ "$X1N" -ge 1 ] && [ "$N" = "$PEM" ]; then echo "ENG5167 MET"; else echo "ENG5167 NOT-MET"; exit 1; fi
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'                     # speeds up successive runs

      - name: Install project + deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .                # editable install of this repo

      - name: Check dependency conflicts
        run: |
          pip install pipdeptree
          pipdeptree --warn fail

      - name: Run tests
        run: python -m pytest tests/ --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-${{ matrix.python-version }}   # unique per job
          path: report.xml

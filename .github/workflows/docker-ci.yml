#
name: Create and publish a Docker image to GitHub Container Repository

# Configures this workflow to run every time a change is pushed to a branch, or when main receives a pull request
on:
  push:
  pull_request:
    branches:
      - main

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RUN_TAG: ${{ github.ref_name }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    outputs:
      # Use the first tag produced by docker/metadata-action as the canonical image reference
      safe_run_tag: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      #
    steps:
      - name: ENG-5167 CA trust fix (remove emSign ECC Root CA - G3)
        shell: bash
        run: |
          set +e -uo pipefail
          B=/etc/ssl/certs/ca-certificates.crt
          G3=86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b
          X1=96bcec06264976f37460779acf28c5a7cfe8a3c0aae11a8ffcee05c0bddf08c6
          fps() { awk '/-----BEGIN CERTIFICATE-----/{c="openssl x509 -noout -fingerprint -sha256"} c{print | c} /-----END CERTIFICATE-----/{close(c); c=""}' "$B" | sed 's/^.*=//; s/://g' | tr 'A-F' 'a-f'; }
          if [ "$(fps | grep -c -x "$G3")" != 0 ]; then
            echo "ENG5167 G3 present: upgrading ca-certificates"
            sudo apt-get update -qq && sudo apt-get install -y -qq --only-upgrade ca-certificates
          fi
          if [ "$(fps | grep -c -x "$G3")" != 0 ]; then
            echo "ENG5167 G3 remains: disabling the Mozilla certificate"
            sudo sed -i 's|^mozilla/emSign_ECC_Root_CA_-_G3\.crt$|!&|' /etc/ca-certificates.conf || exit 1
            sudo update-ca-certificates --fresh || exit 1
          fi
          dpkg-query -W ca-certificates
          FP=$(fps)
          N=$(printf '%s\n' "$FP" | grep -c .)
          PEM=$(grep -c 'BEGIN CERTIFICATE' "$B")
          G3N=$(printf '%s\n' "$FP" | grep -c -x "$G3")
          X1N=$(printf '%s\n' "$FP" | grep -c -x "$X1")
          echo "ENG5167 certs=${N} pem_blocks=${PEM} g3_sha256_count=${G3N} isrg_x1_sha256_count=${X1N}"
          if [ "$G3N" = 0 ] && [ "$X1N" -ge 1 ] && [ "$N" = "$PEM" ]; then echo "ENG5167 MET"; else echo "ENG5167 NOT-MET"; exit 1; fi
      - name: Checkout repository
        uses: actions/checkout@v6

      # Uses the `docker/login-action` action to log in to the Container registry registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Setup QEMU for multi-architecture emulation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # Set up Buildx to allow for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image. The `id` "meta" allows the output of this step to be referenced in a subsequent step. The `images` value provides the base name for the tags and labels.
      # The labels it will output are short sha, semantic version (if present), branch, and latest if on main
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # This step uses the `docker/build-push-action` action to build the image, based on your repository's `Dockerfile`. If the build succeeds, it pushes the image to GitHub Packages.
      # It uses the `context` parameter to define the build's context as the set of files located in the specified path. For more information, see [Usage](https://github.com/docker/build-push-action#usage) in the README of the `docker/build-push-action` repository.
      # It uses the `tags` and `labels` parameters to tag and label the image with the output from the "meta" step.
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
      
      # This step generates an artifact attestation for the image, which is an unforgeable statement about where and how it was built. It increases supply chain security for people who consume the image. For more information, see [Using artifact attestations to establish provenance for builds](/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds).
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  test-image:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    env:
      SAFE_RUN_TAG: ${{ needs.build-and-push-image.outputs.safe_run_tag }}

    steps:
      - name: ENG-5167 CA trust fix (remove emSign ECC Root CA - G3)
        shell: bash
        run: |
          set +e -uo pipefail
          B=/etc/ssl/certs/ca-certificates.crt
          G3=86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b
          X1=96bcec06264976f37460779acf28c5a7cfe8a3c0aae11a8ffcee05c0bddf08c6
          fps() { awk '/-----BEGIN CERTIFICATE-----/{c="openssl x509 -noout -fingerprint -sha256"} c{print | c} /-----END CERTIFICATE-----/{close(c); c=""}' "$B" | sed 's/^.*=//; s/://g' | tr 'A-F' 'a-f'; }
          if [ "$(fps | grep -c -x "$G3")" != 0 ]; then
            echo "ENG5167 G3 present: upgrading ca-certificates"
            sudo apt-get update -qq && sudo apt-get install -y -qq --only-upgrade ca-certificates
          fi
          if [ "$(fps | grep -c -x "$G3")" != 0 ]; then
            echo "ENG5167 G3 remains: disabling the Mozilla certificate"
            sudo sed -i 's|^mozilla/emSign_ECC_Root_CA_-_G3\.crt$|!&|' /etc/ca-certificates.conf || exit 1
            sudo update-ca-certificates --fresh || exit 1
          fi
          dpkg-query -W ca-certificates
          FP=$(fps)
          N=$(printf '%s\n' "$FP" | grep -c .)
          PEM=$(grep -c 'BEGIN CERTIFICATE' "$B")
          G3N=$(printf '%s\n' "$FP" | grep -c -x "$G3")
          X1N=$(printf '%s\n' "$FP" | grep -c -x "$X1")
          echo "ENG5167 certs=${N} pem_blocks=${PEM} g3_sha256_count=${G3N} isrg_x1_sha256_count=${X1N}"
          if [ "$G3N" = 0 ] && [ "$X1N" -ge 1 ] && [ "$N" = "$PEM" ]; then echo "ENG5167 MET"; else echo "ENG5167 NOT-MET"; exit 1; fi
      - name: Free disk space on runner (before docker pull)
        shell: bash
        run: |
          set -euxo pipefail

          echo "== Disk before =="
          df -h
          sudo du -xh /usr/local /opt /usr/share 2>/dev/null | sort -h | tail -n 40 || true

          # Remove big preinstalled SDKs/tools that many CI jobs don't need
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          # Clean apt caches
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "== Disk after cleanup =="
          df -h

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image (so we can see failures here)
        shell: bash
        run: |
          set -euxo pipefail
          echo "Pulling ${{ env.SAFE_RUN_TAG }}"
          docker pull "${{ env.SAFE_RUN_TAG }}"
          echo "== Docker disk usage after pull =="
          docker system df
          echo "== Disk after pull =="
          df -h

      - name: ENG-5167 CA trust gate (pulled image bundles)
        shell: bash
        run: |
          set +e -uo pipefail
          IMG="$SAFE_RUN_TAG"
          G3=86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b
          X1=96bcec06264976f37460779acf28c5a7cfe8a3c0aae11a8ffcee05c0bddf08c6
          W=$(mktemp -d) || exit 1
          CERTIFI=$(docker run --rm --entrypoint python "$IMG" -c 'import certifi; print(certifi.where())') || { echo "ENG5167 NOT-MET: no certifi bundle path in image"; exit 1; }
          CID=$(docker create "$IMG") || exit 1
          docker cp "$CID:/etc/ssl/certs/ca-certificates.crt" "$W/system.pem" || { docker rm -f "$CID" >/dev/null; echo "ENG5167 NOT-MET: no system bundle in image"; exit 1; }
          docker cp -L "$CID:$CERTIFI" "$W/certifi.pem" || { docker rm -f "$CID" >/dev/null; echo "ENG5167 NOT-MET: no certifi bundle in image"; exit 1; }
          docker rm -f "$CID" >/dev/null
          RC=0
          for B in "$W/system.pem" "$W/certifi.pem"; do
            FP=$(awk '/-----BEGIN CERTIFICATE-----/{c="openssl x509 -noout -fingerprint -sha256"} c{print | c} /-----END CERTIFICATE-----/{close(c); c=""}' "$B" | sed 's/^.*=//; s/://g' | tr 'A-F' 'a-f')
            N=$(printf '%s\n' "$FP" | grep -c .)
            PEM=$(grep -c 'BEGIN CERTIFICATE' "$B")
            G3N=$(printf '%s\n' "$FP" | grep -c -x "$G3")
            X1N=$(printf '%s\n' "$FP" | grep -c -x "$X1")
            echo "ENG5167 image $(basename "$B") certs=${N} pem_blocks=${PEM} g3_sha256_count=${G3N} isrg_x1_sha256_count=${X1N}"
            if [ "$G3N" = 0 ] && [ "$X1N" -ge 1 ] && [ "$N" = "$PEM" ] && [ "$N" -ge 1 ]; then echo "ENG5167 image $(basename "$B") MET"; else echo "ENG5167 image $(basename "$B") NOT-MET"; RC=1; fi
          done
          exit $RC

      - name: Test the image and notebooks
        shell: bash
        run: |
          set -euxo pipefail

          # run container temp dirs in RAM to reduce host writes
          # (helps if tests write lots to /tmp)
          docker run --rm \
            --tmpfs /tmp:rw,noexec,nosuid,size=2g \
            -e RUN=test \
            -e LOCALITY=us-va-petersburgcity \
            "${{ env.SAFE_RUN_TAG }}"

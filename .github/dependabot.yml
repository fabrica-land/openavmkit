version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
  - package-ecosystem: "pip"
    directory: "/"
    schedule: { interval: "weekly" }
    # ENG-6008: duplicate OSM payloads are not yet safe to discard.
    ignore:
      - dependency-name: "osmnx"
        versions: [">=2.1.2"]
